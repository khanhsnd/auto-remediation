services:
  app:
    build: .
    image: content-telegram:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/messages.db
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - messages:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  messages:
