// =============================================================================
// agent.proto - Hợp đồng (contract) giữa Engine và Agent chạy trên node hạ tầng.
//
// Ý tưởng: Engine (web app) không tự SSH vào server. Nó gọi gRPC tới một Agent
// nhỏ chạy sẵn trên từng node/cluster. Agent mới là bên thực sự restart service,
// scale pod, xoá cache... Cách này an toàn và dễ audit hơn nhiều.
//
// Vì sao gRPC mà không phải REST?
//   - Contract chặt (sinh code cả 2 phía, sai kiểu là compile-time biết luôn)
//   - HTTP/2, nhị phân -> nhẹ và nhanh
//   - Có streaming sẵn (ở đây dùng để stream log realtime khi chạy lệnh)
//
// Sinh code Python:  make proto
// =============================================================================
syntax = "proto3";

package remediation.agent.v1;

// Service = nhóm các RPC. Client sẽ có class AgentServiceStub tương ứng.
service AgentService {
  // Unary RPC: 1 request -> 1 response. Dùng cho lệnh ngắn.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

  // Server streaming RPC: 1 request -> nhiều response.
  // Dùng khi muốn xem log chạy dần dần thay vì chờ xong mới thấy.
  rpc StreamCommand(ExecuteCommandRequest) returns (stream CommandLogChunk);

  // Health check để Engine biết node còn sống trước khi giao việc.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Loại hành động mà Agent hỗ trợ. Enum trong proto3 buộc phải có giá trị 0.
enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  RESTART_SERVICE         = 1;  // systemctl restart / docker restart
  SCALE_WORKLOAD          = 2;  // kubectl scale deployment
  CLEAR_CACHE             = 3;  // xoá cache app
  ROTATE_LOG              = 4;  // xoá/nén log khi full disk
  RUN_SCRIPT              = 5;  // script đã whitelist sẵn
  KILL_PROCESS            = 6;  // kill tiến trình treo
}

message ExecuteCommandRequest {
  string     incident_id  = 1;  // để trace ngược về incident nào gây ra
  string     execution_id = 2;  // 1 incident có thể chạy nhiều lần
  ActionKind action       = 3;
  string     target       = 4;  // vd: "payment-api" hoặc "node-01"

  // map<string,string>: tham số linh hoạt theo từng action.
  // vd RESTART_SERVICE -> {"namespace":"prod"}; SCALE_WORKLOAD -> {"replicas":"5"}
  map<string, string> args = 5;

  int32 timeout_seconds = 6;
  bool  dry_run         = 7;  // true = chỉ kiểm tra, không tác động thật
}

message ExecuteCommandResponse {
  bool   success     = 1;
  int32  exit_code   = 2;
  string stdout      = 3;
  string stderr      = 4;
  int64  duration_ms = 5;

  // optional (proto3) cho phép phân biệt "không gửi" và "gửi giá trị rỗng".
  optional string agent_version = 6;
}

message CommandLogChunk {
  string line       = 1;
  int64  timestamp  = 2;  // epoch milliseconds
  bool   is_stderr  = 3;
  bool   is_final   = 4;  // chunk cuối cùng
}

message HealthCheckRequest  { string target = 1; }

message HealthCheckResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    HEALTHY            = 1;
    DEGRADED           = 2;
    UNHEALTHY          = 3;
  }
  Status              status  = 1;
  string              message = 2;
  map<string, string> metrics = 3;  // vd {"cpu":"91.2","mem":"78.0"}
}
