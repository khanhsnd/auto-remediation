# =============================================================================
# Hạ tầng phụ trợ để chạy project ở local.
#   docker compose up -d
#   docker compose logs -f kafka
#   docker compose down -v      (xoá luôn volume để reset sạch)
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: rem-postgres
    environment:
      POSTGRES_USER: remediation
      POSTGRES_PASSWORD: remediation
      POSTGRES_DB: remediation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # healthcheck giúp các service khác chờ Postgres sẵn sàng thật sự,
    # chứ không chỉ "container đã start".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remediation -d remediation"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rem-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka chế độ KRaft: không cần Zookeeper nữa, nhẹ hơn nhiều khi dev.
  # Dùng image Apache chính thức (apache/kafka). Lưu ý: image bitnami/kafka
  # legacy tag đã bị xoá khỏi Docker Hub, nhiều tutorial cũ sẽ pull lỗi.
  kafka:
    image: apache/kafka:3.9.0
    container_name: rem-kafka
    ports:
      - "9092:9092"
    environment:
      # --- danh tính node trong cluster KRaft ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # --- listener ---
      # PLAINTEXT: cho client bên ngoài container (app của mình)
      # CONTROLLER: chỉ dùng nội bộ cho việc bầu chọn leader
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # --- chỉ 1 broker khi dev nên replication factor phải là 1 ---
      # Để mặc định 3 thì Kafka không tạo được internal topic và treo.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "rem-local-cluster-000001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
