# =============================================================================
# pyproject.toml - "CMND" của một project Python hiện đại (PEP 517/518/621)
# -----------------------------------------------------------------------------
# File này thay thế cho setup.py + requirements.txt + nhiều file config lẻ.
# Ở đây dùng Poetry làm build backend & dependency manager.
#
# KIẾN THỨC CƠ BẢN:
#   - [tool.poetry.dependencies] : thư viện chạy production
#   - optional = true            : không cài mặc định, phải bật qua "extras"
#   - [tool.poetry.extras]       : nhóm các optional deps thành 1 tên gọi
#   => Vì sao chia extras? Service API và service Worker deploy riêng nhau,
#      mỗi bên chỉ cần cài đúng thứ nó dùng -> image Docker nhỏ, ít CVE.
#
# CÀI ĐẶT:
#   poetry install --extras all      (cài hết để dev)
#   poetry install --extras api      (chỉ chạy web API)
# =============================================================================

[tool.poetry]
name = "auto-remediation"
version = "0.1.0"
description = "Hệ thống tự phục hồi hạ tầng: nhận alert -> ghi nhận -> match runbook -> tự xử lý"
authors = ["khanh <duyetnn@fpt.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"

# --- Web layer ---------------------------------------------------------------
fastapi = { version = "==0.136.3", optional = true }
uvicorn = { version = "==0.48.0", optional = true }

# --- Persistence layer -------------------------------------------------------
sqlalchemy = { version = "==2.0.51", optional = true }
asyncpg = { version = "==0.31.0", optional = true }   # driver PostgreSQL async
redis = { version = "==8.0.1", optional = true }      # cache / lock / rate-limit

# --- RPC nội bộ (gọi agent chạy trên node hạ tầng) ---------------------------
grpcio = { version = "==1.82.1", optional = true }
protobuf = { version = "==7.35.1", optional = true }

# --- Gọi API bên ngoài (webhook ngược, Slack, K8s API...) --------------------
httpx = { version = "==0.28.1", optional = true }

# --- Event streaming (hàng đợi xử lý bất đồng bộ) ----------------------------
aiokafka = { version = "==0.12.0", optional = true }

# --- Bảo mật -----------------------------------------------------------------
pyjwt = { version = "==2.13.0", optional = true }

# --- Phụ thuộc bắt buộc thêm -------------------------------------------------
# pydantic-settings: đọc config từ biến môi trường, validate kiểu dữ liệu.
# FastAPI đã kéo theo pydantic v2, nhưng pydantic-settings là package riêng.
pydantic-settings = { version = "^2.6", optional = true }

# email-validator: cần cho EmailStr của Pydantic (schemas/auth.py).
# Không có nó thì app crash lúc build schema, không phải lúc chạy request
# -> lỗi lộ ra ngay khi khởi động, may mà không âm thầm.
email-validator = { version = "^2.2", optional = true }

[tool.poetry.extras]
api    = ["fastapi", "uvicorn", "sqlalchemy", "asyncpg", "redis", "httpx", "pyjwt", "aiokafka", "pydantic-settings", "email-validator"]
worker = ["sqlalchemy", "asyncpg", "redis", "httpx", "aiokafka", "grpcio", "protobuf", "pydantic-settings"]
grpc   = ["grpcio", "protobuf"]
all    = [
    "fastapi", "uvicorn", "sqlalchemy", "asyncpg", "redis",
    "grpcio", "protobuf", "httpx", "aiokafka", "pyjwt", "pydantic-settings",
    "email-validator",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"       # cho phép viết test async def
grpcio-tools = "^1.68"         # sinh code Python từ file .proto
ruff = "^0.8"                  # linter + formatter (nhanh, thay flake8+isort+black)
mypy = "^1.13"                 # static type checker
aiosqlite = "^0.20"            # DB in-memory để test không cần Postgres

# --- Entry point: sau khi install sẽ có lệnh CLI "remediation" ---------------
[tool.poetry.scripts]
remediation = "app.cli:main"

# =============================================================================
# Cấu hình công cụ phụ trợ
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
# Code do protoc sinh ra - không sửa tay nên cũng không lint.
extend-exclude = ["app/infra/grpc/generated"]

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, ASYNC: lỗi async
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
# ASYNC109: ruff khuyên dùng asyncio.timeout thay vì tham số timeout.
# Ở đây ta CỐ Ý nhận timeout vì httpx/grpc đã có cơ chế timeout riêng,
# tốt hơn là bọc thêm một lớp asyncio.timeout bên ngoài.
ignore = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true                            # bật hết check - học type hint thì nên strict
exclude = ["app/infra/grpc/generated"]   # code sinh tự động thì bỏ qua

# aiokafka và grpc chưa ship type stub (không có file py.typed).
# Không bỏ qua thì mypy strict báo lỗi ở mọi dòng import - nhiễu vô ích.
# Cách này chỉ tắt check CHO ĐÚNG các thư viện đó, code của mình vẫn strict.
[[tool.mypy.overrides]]
module = ["aiokafka.*", "grpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"          # không cần @pytest.mark.asyncio ở từng test
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
